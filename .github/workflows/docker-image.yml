name: Build BluraySubtitle for Ubuntu 26.04

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve Build Versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          retry_ls_remote() {
            local source="$1"
            shift
            local attempt
            local refs
            for attempt in 1 2 3 4 5; do
              if refs="$(timeout 45s git ls-remote "$@")"; then
                printf '%s\n' "$refs"
                return 0
              fi
              if [[ "$attempt" -lt 5 ]]; then
                echo "::warning::Failed to query ${source} (attempt ${attempt}/5); retrying." >&2
                sleep $((attempt * 5))
              fi
            done
            echo "::error::Failed to query ${source} after 5 attempts." >&2
            return 1
          }

          resolve_latest_tag() {
            local output_name="$1"
            local source="$2"
            local pattern="$3"
            local refs
            local tag
            refs="$(retry_ls_remote "$source" --refs --tags --sort=-version:refname "$source")"
            tag="$(awk -F 'refs/tags/' -v pattern="$pattern" 'NF == 2 && $2 ~ pattern { print $2; exit }' <<<"$refs")"
            if [[ -z "$tag" ]]; then
              echo "::error::No matching release tag found for ${source}." >&2
              return 1
            fi
            printf '%s=%s\n' "$output_name" "$tag" >> "$GITHUB_OUTPUT"
          }

          resolve_branch_commit() {
            local output_name="$1"
            local source="$2"
            local branch="$3"
            local refs
            local commit
            refs="$(retry_ls_remote "$source" --exit-code "$source" "refs/heads/${branch}")"
            commit="$(awk 'NR == 1 { print $1 }' <<<"$refs")"
            if [[ -z "$commit" ]]; then
              echo "::error::Branch ${branch} was not found for ${source}." >&2
              return 1
            fi
            printf '%s=%s\n' "$output_name" "$commit" >> "$GITHUB_OUTPUT"
          }

          resolve_latest_tag ffmpeg_tag https://github.com/FFmpeg/FFmpeg.git '^[nN]?[0-9]+([.][0-9]+)+$'
          resolve_latest_tag x265_tag https://github.com/Multicorewareinc/x265.git '^[0-9]+([.][0-9]+)+$'
          resolve_latest_tag svt_av1_tag https://gitlab.com/AOMediaCodec/SVT-AV1.git '^[vV]?[0-9]+([.][0-9]+)+$'
          resolve_latest_tag fdk_aac_tag https://github.com/mstorsjo/fdk-aac.git '^[vV]?[0-9]+([.][0-9]+)+$'
          resolve_latest_tag fdkaac_tag https://github.com/nu774/fdkaac.git '^[vV]?[0-9]+([.][0-9]+)+$'
          resolve_branch_commit x264_commit https://github.com/mirror/x264.git master
          resolve_latest_tag tsmuxer_tag https://github.com/justdan96/tsMuxer.git '^[vV]?[0-9]+([.][0-9]+)+$'
          resolve_latest_tag hdr10plus_tag https://github.com/quietvoid/hdr10plus_tool.git '^[vV]?[0-9]+([.][0-9]+)+$'

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: . 
          platforms: linux/amd64 
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bluraysubtitle:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bluraysubtitle:26.04
          build-args: |
            FFMPEG_TAG=${{ steps.versions.outputs.ffmpeg_tag }}
            X265_TAG=${{ steps.versions.outputs.x265_tag }}
            SVT_AV1_TAG=${{ steps.versions.outputs.svt_av1_tag }}
            FDK_AAC_TAG=${{ steps.versions.outputs.fdk_aac_tag }}
            FDKAAC_TAG=${{ steps.versions.outputs.fdkaac_tag }}
            X264_COMMIT=${{ steps.versions.outputs.x264_commit }}
            TSMUXER_TAG=${{ steps.versions.outputs.tsmuxer_tag }}
            HDR10PLUS_TAG=${{ steps.versions.outputs.hdr10plus_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
