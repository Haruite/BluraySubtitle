name: Publish BluraySubtitle Ubuntu 26.04 x64

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ubuntu-package-website
  queue: max

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    env:
      BLURAY_LANG: en
      CCACHE_MAXSIZE: 2G
      PACKAGE_ARCHIVE: BluraySubtitle_ubuntu26.04_x64.tar.xz
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set Build and Cache Paths
        run: |
          {
            printf 'BLURAY_SETUP_CACHE_DIR=%s/bluraysubtitle-linux\n' "$RUNNER_TEMP"
            printf 'BLURAY_BUILD_TMP=%s/bluraysubtitle-build\n' "$RUNNER_TEMP"
            printf 'BLURAY_APT_RESTORED_PACKAGES=%s/bluraysubtitle-restored-apt-packages.json\n' "$RUNNER_TEMP"
          } >> "$GITHUB_ENV"

      - name: Restore Setup Downloads and Compiler Cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/downloads
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/apt
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/pip
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/ccache
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/cargo
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ubuntu2604-setup-v1-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ubuntu2604-setup-v1-${{ runner.arch }}-

      - name: Restore Installed Build Artifacts
        id: builds
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.BLURAY_SETUP_CACHE_DIR }}/builds/components/*.tar.xz
          key: ubuntu2604-tools-v2-${{ runner.arch }}-lookup
          restore-keys: ubuntu2604-tools-v2-${{ runner.arch }}-

      - name: Restore Ubuntu APT Package List
        id: apt-runtime
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.BLURAY_SETUP_CACHE_DIR }}/apt-runtime
          key: ubuntu2604-apt-runtime-v2-${{ runner.arch }}-lookup
          restore-keys: ubuntu2604-apt-runtime-v2-${{ runner.arch }}-

      - name: Build Ubuntu Package from Cached Tools
        id: cached
        if: steps.apt-runtime.outputs.cache-matched-key != ''
        env:
          BLURAYSUBTITLE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          output=$(mktemp -d "$RUNNER_TEMP/ubuntu-cached-package.XXXXXXXX")
          trap 'rm -rf -- "$output"' EXIT
          if bash setup_linux_environment.sh --mod Build --restore-only &&
              bash tools/build_ubuntu_package.sh "$output" &&
              /usr/bin/python3 -B tools/verify_ubuntu_package.py "$output/$PACKAGE_ARCHIVE"; then
            mkdir -p dist
            mv --update=none-fail -- "$output/$PACKAGE_ARCHIVE" "$output/$PACKAGE_ARCHIVE.txt" dist/
            printf 'built=true\n' >> "$GITHUB_OUTPUT"
          else
            echo 'Cached Ubuntu build could not be verified. Running setup.'
          fi

      - name: Prepare Ubuntu Build Environment
        id: setup
        if: steps.cached.outputs.built != 'true'
        env:
          BLURAYSUBTITLE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash setup_linux_environment.sh --mod Build

      - name: Save Setup Downloads and Compiler Cache
        if: steps.setup.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/downloads
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/apt
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/pip
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/ccache
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/cargo
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ubuntu2604-setup-v1-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Collect Ubuntu Tool Cache Key
        id: tool-cache
        if: ${{ !cancelled() && (steps.cached.outputs.built == 'true' || steps.setup.outcome == 'success' || steps.setup.outcome == 'failure') }}
        run: |
          set -euo pipefail
          builds="$BLURAY_SETUP_CACHE_DIR/builds/components"
          [[ -d "$builds" ]] || exit 0
          cd "$builds"
          shopt -s nullglob
          archives=(*.tar.xz)
          (( ${#archives[@]} )) || exit 0
          checksum=$(sha256sum -- "${archives[@]}" | sha256sum)
          printf 'key=ubuntu2604-tools-v2-%s-%s\n' "$RUNNER_ARCH" "${checksum%% *}" >> "$GITHUB_OUTPUT"

      - name: Save Installed Build Artifacts
        if: ${{ !cancelled() && steps.tool-cache.outputs.key != '' && steps.builds.outputs.cache-matched-key != steps.tool-cache.outputs.key }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.BLURAY_SETUP_CACHE_DIR }}/builds/components/*.tar.xz
          key: ${{ steps.tool-cache.outputs.key }}

      - name: Build and Verify Ubuntu Package
        id: package
        if: steps.cached.outputs.built != 'true'
        env:
          BLURAY_APT_CACHE_PATHS: ${{ runner.temp }}/bluraysubtitle-apt-paths.txt
        run: |
          set -euo pipefail
          bash tools/build_ubuntu_package.sh
          /usr/bin/python3 -B tools/verify_ubuntu_package.py "dist/$PACKAGE_ARCHIVE"
          if /usr/bin/python3 -B tools/ubuntu_apt_cache.py save "$BLURAY_SETUP_CACHE_DIR" "$BLURAY_APT_CACHE_PATHS"; then
            checksum=$(sha256sum < "$BLURAY_SETUP_CACHE_DIR/apt-runtime/packages.json")
            printf 'apt-key=ubuntu2604-apt-runtime-v2-%s-%s\n' "$RUNNER_ARCH" "${checksum%% *}" >> "$GITHUB_OUTPUT"
          fi

      - name: Save Ubuntu APT Package List
        if: steps.package.outputs.apt-key != '' && steps.apt-runtime.outputs.cache-matched-key != steps.package.outputs.apt-key
        uses: actions/cache/save@v6
        with:
          path: ${{ env.BLURAY_SETUP_CACHE_DIR }}/apt-runtime
          key: ${{ steps.package.outputs.apt-key }}

      - name: Upload Package and Build Information
        if: github.ref == 'refs/heads/main'
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
          SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
        run: bash tools/publish_website_package.sh "dist/$PACKAGE_ARCHIVE"
