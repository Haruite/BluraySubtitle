name: Build and Publish a Linux Package

on:
  workflow_call:
    inputs:
      architecture:
        required: true
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: linux-${{ inputs.architecture }}-package-website
  queue: max

jobs:
  publish:
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 180
    env:
      BLURAY_LANG: en
      CCACHE_MAXSIZE: 2G
      PACKAGE_CACHE_PREFIX: ubuntu2604-build-v1-${{ inputs.architecture }}-
      PACKAGE_ARCHIVE: BluraySubtitle_linux_${{ inputs.architecture }}.tar.xz
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set Build and Cache Paths
        run: |
          {
            printf 'BLURAY_SETUP_CACHE_DIR=%s/bluraysubtitle-linux\n' "$RUNNER_TEMP"
            printf 'BLURAY_BUILD_TMP=%s/bluraysubtitle-build\n' "$RUNNER_TEMP"
            printf 'BLURAY_APT_RESTORED_PACKAGES=%s/bluraysubtitle-restored-apt-packages.json\n' "$RUNNER_TEMP"
            printf 'BLURAY_APT_CACHE_PATHS=%s/bluraysubtitle-apt-paths.txt\n' "$RUNNER_TEMP"
          } >> "$GITHUB_ENV"

      - name: Restore Linux Build Cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: &cache-paths |
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/downloads
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/pip
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/ccache
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/cargo
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/builds/components/*.tar.xz
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/apt/*.deb
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/apt-runtime/packages.json
          key: ${{ env.PACKAGE_CACHE_PREFIX }}lookup
          restore-keys: ${{ env.PACKAGE_CACHE_PREFIX }}

      - name: Restore Previous Setup Downloads and Compiler Cache
        id: downloads
        if: steps.cache.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/downloads
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/pip
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/ccache
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/cargo
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ubuntu2604-setup-v2-${{ runner.arch }}-lookup
          restore-keys: ubuntu2604-setup-v2-${{ runner.arch }}-

      - name: Restore Legacy Setup Cache
        id: legacy-downloads
        if: steps.cache.outputs.cache-matched-key == '' && steps.downloads.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/downloads
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/apt
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/pip
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/ccache
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/cargo
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ubuntu2604-setup-v1-${{ runner.arch }}-lookup
          restore-keys: ubuntu2604-setup-v1-${{ runner.arch }}-

      - name: Restore Installed Build Artifacts
        id: builds
        if: steps.cache.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.BLURAY_SETUP_CACHE_DIR }}/builds/components/*.tar.xz
          key: ubuntu2604-tools-v3-${{ runner.arch }}-lookup
          restore-keys: |
            ubuntu2604-tools-v3-${{ runner.arch }}-
            ubuntu2604-tools-v2-${{ runner.arch }}-

      - name: Read the Previous x64 Build Recipes
        if: startsWith(steps.builds.outputs.cache-matched-key, 'ubuntu2604-tools-v2-X64-')
        run: |
          set -euo pipefail
          revision=0094649202280d37968cd33a2c152a3051c32481
          if git cat-file -e "$revision:setup_linux_environment.sh" 2>/dev/null ||
             git fetch --no-tags --depth=1 --no-write-fetch-head origin "$revision"; then
            legacy="$RUNNER_TEMP/linux-legacy-setup.sh"
            git show "$revision:setup_linux_environment.sh" > "$legacy"
            printf 'BLURAY_LEGACY_CACHE_SETUP=%s\n' "$legacy" >> "$GITHUB_ENV"
          else
            echo "::warning::Could not read the previous x64 build recipes"
          fi

      - name: Restore Ubuntu APT Packages and Manifest
        id: apt-runtime
        if: steps.cache.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/apt/*.deb
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/apt-runtime/packages.json
          key: ubuntu2604-apt-runtime-v3-${{ runner.arch }}-lookup
          restore-keys: ubuntu2604-apt-runtime-v3-${{ runner.arch }}-

      - name: Restore Legacy APT Manifest
        id: legacy-apt
        if: steps.apt-runtime.outputs.cache-matched-key == '' && steps.legacy-downloads.outputs.cache-matched-key != ''
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.BLURAY_SETUP_CACHE_DIR }}/apt-runtime
          key: ubuntu2604-apt-runtime-v2-${{ runner.arch }}-lookup
          restore-keys: ubuntu2604-apt-runtime-v2-${{ runner.arch }}-

      - name: Build Linux Package from Cached Tools
        id: cached
        if: >-
          steps.cache.outputs.cache-matched-key != '' ||
          (steps.builds.outputs.cache-matched-key != '' &&
           (steps.apt-runtime.outputs.cache-matched-key != '' || steps.legacy-apt.outputs.cache-matched-key != ''))
        env:
          BLURAYSUBTITLE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          output=$(mktemp -d "$RUNNER_TEMP/linux-cached-package.XXXXXXXX")
          trap 'rm -rf -- "$output"' EXIT
          if bash setup_linux_environment.sh --mode Build --restore-only &&
              bash tools/build_linux_package.sh "$output" &&
              /usr/bin/python3 -B tools/verify_linux_package.py "$output/$PACKAGE_ARCHIVE"; then
            mkdir -p dist
            mv --update=none-fail -- "$output/$PACKAGE_ARCHIVE" "$output/$PACKAGE_ARCHIVE.txt" dist/
            printf 'built=true\n' >> "$GITHUB_OUTPUT"
          else
            echo 'Cached Linux build could not be verified. Running setup.'
          fi

      - name: Prepare Linux Build Environment
        if: steps.cached.outputs.built != 'true'
        env:
          BLURAYSUBTITLE_GITHUB_TOKEN: ${{ github.token }}
          BLURAY_BUILD_CACHE_PROBED: ${{ steps.cached.outcome == 'success' }}
        run: |
          set -euo pipefail
          bash setup_linux_environment.sh --mode Build

      - name: Build and Verify Linux Package
        if: steps.cached.outputs.built != 'true'
        run: |
          set -euo pipefail
          bash tools/build_linux_package.sh
          /usr/bin/python3 -B tools/verify_linux_package.py "dist/$PACKAGE_ARCHIVE"

      - name: Fingerprint Linux Build Cache
        id: snapshot
        if: >-
          github.ref == 'refs/heads/main' &&
          (steps.cache.outputs.cache-matched-key == '' || steps.cached.outputs.built != 'true')
        continue-on-error: true
        run: |
          set -euo pipefail
          /usr/bin/python3 -B tools/linux_apt_cache.py save "$BLURAY_SETUP_CACHE_DIR" "$BLURAY_APT_CACHE_PATHS"
          /usr/bin/python3 -B tools/linux_actions_cache.py

      - name: Save Linux Build Cache
        if: steps.snapshot.outputs.key != '' && steps.snapshot.outputs.key != steps.cache.outputs.cache-matched-key
        uses: actions/cache/save@v6
        with:
          path: *cache-paths
          key: ${{ steps.snapshot.outputs.key }}

      - name: Prune Superseded Linux Caches
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SAVED_CACHE: ${{ steps.snapshot.outputs.key || (steps.cached.outputs.built == 'true' && steps.cache.outputs.cache-matched-key) || '' }}
        run: |
          /usr/bin/python3 -B tools/actions_cache.py "$PACKAGE_CACHE_PREFIX" "$SAVED_CACHE" \
            "ubuntu2604-setup-v1-$RUNNER_ARCH-" "ubuntu2604-setup-v2-$RUNNER_ARCH-" \
            "ubuntu2604-tools-v2-$RUNNER_ARCH-" "ubuntu2604-tools-v3-$RUNNER_ARCH-" \
            "ubuntu2604-apt-runtime-v2-$RUNNER_ARCH-" "ubuntu2604-apt-runtime-v3-$RUNNER_ARCH-"

      - name: Upload Package and Build Information
        if: github.ref == 'refs/heads/main'
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
          SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
        run: bash tools/publish_website_package.sh "dist/$PACKAGE_ARCHIVE"
