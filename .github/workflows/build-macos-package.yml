name: Build and Publish a macOS Package
on:
  workflow_call:
    inputs:
      architecture:
        required: true
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: macos-${{ inputs.architecture }}-package-website
  queue: max

jobs:
  publish:
    runs-on: ${{ inputs.architecture == 'arm64' && 'macos-26' || 'macos-26-intel' }}
    timeout-minutes: 360
    env:
      BLURAY_LANG: en
      PACKAGE_CACHE_PREFIX: macos-build-v1-${{ inputs.architecture }}-
      PACKAGE_ARCHIVE: BluraySubtitle_macos_${{ inputs.architecture }}.zip
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select the native Big Sur toolchain
        env:
          EXPECTED_ARCH: ${{ inputs.architecture }}
        run: |
          set -euo pipefail
          arch=$(uname -m)
          case "$EXPECTED_ARCH/$arch" in x64/x86_64|arm64/arm64) ;; *) exit 1 ;; esac
          python3 - <<'PY' >> "$GITHUB_ENV"
          from pathlib import Path
          import platform, re
          apps = [(tuple(map(int, m[1].split("."))), app)
                  for app in Path("/Applications").glob("Xcode_26*.app")
                  if (m := re.fullmatch(r"Xcode_(26(?:\.\d+)*)\.app",app.name))]
          print(f"DEVELOPER_DIR={max(apps)[1]}/Contents/Developer")
          print(f"BLURAY_SETUP_CACHE_DIR={Path.home()}/Library/Caches/BluraySubtitle/macos-{platform.machine()}")
          PY
          sw_vers
          sysctl -n machdep.cpu.brand_string
          echo "BLURAY_MACOS_CACHE_PLAN=$RUNNER_TEMP/macos-cache-plan.json" >> "$GITHUB_ENV"
      - name: Restore macOS Build Cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: &cache-paths |
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/downloads
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/qt-sdk
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/pip
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/cargo/registry/cache
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/cargo/git/db
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/uv-cache
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/zig-cache/p
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/interpreters
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/ccache
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/mamba/pkgs/**/*.conda
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/mamba/pkgs/**/*.tar.bz2
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/components/*.tar.gz
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/components/*.tar.sha256
          key: ${{ env.PACKAGE_CACHE_PREFIX }}lookup
          restore-keys: ${{ env.PACKAGE_CACHE_PREFIX }}
      - name: Restore source and tool downloads
        id: downloads
        if: steps.cache.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/downloads
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/qt-sdk
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/pip
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/cargo/registry/cache
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/cargo/git/db
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/uv-cache
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/zig-cache/p
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/interpreters
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/ccache
          key: macos-setup-v2-${{ runner.arch }}-lookup
          restore-keys: macos-setup-v2-${{ runner.arch }}-
      - name: Restore Conda package downloads
        id: conda
        if: steps.cache.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/mamba/pkgs/**/*.conda
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/mamba/pkgs/**/*.tar.bz2
          key: macos-conda-v2-${{ runner.arch }}-lookup
          restore-keys: macos-conda-v2-${{ runner.arch }}-
      - name: Reuse previous combined download cache on a cold runner
        if: >-
          steps.cache.outputs.cache-matched-key == '' &&
          steps.downloads.outputs.cache-matched-key == '' && steps.conda.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/downloads
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/mamba/pkgs/**/*.conda
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/mamba/pkgs/**/*.tar.bz2
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/qt-sdk
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/pip
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/cargo/registry/cache
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/cargo/git/db
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/uv-cache
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/zig-cache/p
          key: macos-downloads-v1-${{ runner.arch }}-lookup
          restore-keys: macos-downloads-v1-${{ runner.arch }}-
      - name: Resolve current upstream versions and component cache keys
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./setup_macos_environment.sh --mode Build --plan "$BLURAY_MACOS_CACHE_PLAN"
      - name: Prepare legacy component cache client
        if: steps.cache.outputs.cache-matched-key == ''
        run: npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/bluray-cache-client" @actions/cache
      - uses: actions/github-script@v9
        name: Restore previously cached native components
        if: steps.cache.outputs.cache-matched-key == ''
        with:
          script: await require(process.env.GITHUB_WORKSPACE + '/tools/macos_component_cache.cjs')(core)
      - name: Build and verify the relocated package
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./setup_macos_environment.sh --mode Build --from-plan "$BLURAY_MACOS_CACHE_PLAN"
      - name: Fingerprint macOS Build Cache
        id: snapshot
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        continue-on-error: true
        env:
          RESTORED_CACHE_KEY: ${{ steps.cache.outputs.cache-matched-key }}
          COMPLETED_COMPONENTS: ${{ toJSON(steps.build.outputs) }}
        run: python3 -B tools/macos_actions_cache.py
      - name: Save macOS Build Cache
        if: ${{ !cancelled() && steps.snapshot.outputs.key != '' && steps.snapshot.outputs.key != steps.cache.outputs.cache-matched-key }}
        uses: actions/cache/save@v6
        with:
          path: *cache-paths
          key: ${{ steps.snapshot.outputs.key }}
      - name: Prune Superseded macOS Caches
        if: ${{ !cancelled() && steps.snapshot.outputs.key != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SAVED_CACHE: ${{ steps.snapshot.outputs.key }}
        run: |
          python3 -B tools/actions_cache.py "$PACKAGE_CACHE_PREFIX" "$SAVED_CACHE" \
            "macos-downloads-v1-$RUNNER_ARCH-" "macos-setup-v2-$RUNNER_ARCH-" \
            "macos-conda-v2-$RUNNER_ARCH-" "bluraysubtitle-macos-v2-$RUNNER_ARCH-"
      - name: Upload package and build record
        if: github.ref == 'refs/heads/main'
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
          SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
        run: bash tools/publish_website_package.sh "dist/$PACKAGE_ARCHIVE"
