name: Build and Publish a Windows Package

on:
  workflow_call:
    inputs:
      architecture:
        required: true
        type: string
      compatibility:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-package-website-${{ inputs.architecture }}${{ inputs.compatibility && '-compat' || '' }}
  queue: max

jobs:
  publish:
    runs-on: ${{ inputs.architecture == 'arm64' && 'windows-11-vs2026-arm' || 'windows-2025-vs2026' }}
    timeout-minutes: ${{ inputs.compatibility && 180 || 360 }}
    outputs:
      architecture: ${{ runner.arch }}
      restored-pip: ${{ steps.restored.outcome == 'success' && steps.restored.outputs.pip == steps.downloads.outputs.cache-matched-key && steps.restored.outputs.pip || '' }}
      restored-tools: ${{ steps.restored.outcome == 'success' && steps.restored.outputs.tools == steps.builds.outputs.cache-matched-key && steps.restored.outputs.tools || '' }}
      restored-shared: ${{ steps.restored.outputs.shared == steps.builds.outputs.cache-matched-key && steps.restored.outputs.shared || '' }}
      restored-standard: ${{ steps.restored.outputs.standard == steps.standard.outputs.cache-matched-key && steps.restored.outputs.standard || '' }}
      restored-compat: ${{ steps.restored.outcome == 'success' && steps.restored.outputs.compat == steps.compat.outputs.cache-matched-key && steps.restored.outputs.compat || '' }}
    env:
      PACKAGE_NAME: BluraySubtitle_windows_${{ inputs.architecture }}${{ inputs.compatibility && '_compat' || '' }}
      PACKAGE_ARCHITECTURE: ${{ inputs.architecture }}
      WINDOWS_COMPATIBILITY: ${{ inputs.compatibility && '1' || '' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Restore Python Package Downloads
        id: downloads
        if: ${{ !inputs.compatibility }}
        uses: actions/cache/restore@v6
        with:
          path: &pip-path ${{ runner.temp }}/bluraysubtitle-pip
          key: windows-pip-v2-${{ runner.arch }}-lookup
          restore-keys: |
            windows-pip-v2-${{ runner.arch }}-
            windows-pip-v1-${{ runner.arch }}-

      - name: Restore Standard x64 Tool Artifacts
        id: standard
        if: inputs.architecture == 'x64' && !inputs.compatibility
        uses: actions/cache/restore@v6
        with:
          path: &standard-path ${{ runner.temp }}/bluraysubtitle-builds/artifacts/standard/*.zip
          key: windows-standard-v1-${{ runner.arch }}-lookup
          restore-keys: windows-standard-v1-${{ runner.arch }}-

      - name: Migrate Previous Standard x64 Tool Cache
        if: inputs.architecture == 'x64' && !inputs.compatibility && steps.standard.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v6
        with:
          path: &tools-path ${{ runner.temp }}/bluraysubtitle-builds/artifacts/${{ inputs.architecture == 'arm64' && 'arm64/' || '' }}*.zip
          key: windows-tools-v4-${{ runner.arch }}-lookup
          restore-keys: |
            windows-tools-v4-${{ runner.arch }}-
            windows-tools-v3-${{ runner.arch }}-

      - name: Restore Windows Tool Artifacts
        id: builds
        uses: actions/cache/restore@v6
        with:
          path: *tools-path
          key: ${{ inputs.architecture == 'x64' && 'windows-shared-v1' || 'windows-tools-v4' }}-${{ runner.arch }}-lookup
          restore-keys: |
            ${{ inputs.architecture == 'x64' && 'windows-shared-v1' || 'windows-tools-v4' }}-${{ runner.arch }}-
            ${{ inputs.architecture == 'arm64' && format('windows-tools-v3-{0}-', runner.arch) || '' }}

      - name: Restore Windows Compatibility Build Inputs
        id: compat
        if: inputs.compatibility
        uses: actions/cache/restore@v6
        with:
          path: &compat-path |
            ${{ runner.temp }}/bluraysubtitle-compat/cache/*.zip
            ${{ runner.temp }}/bluraysubtitle-compat/downloads
            ${{ runner.temp }}/bluraysubtitle-compat/rust-cargo/registry/cache
            ${{ runner.temp }}/bluraysubtitle-compat/rust-cargo/registry/index
          key: windows-compat-v1-${{ runner.arch }}-lookup
          restore-keys: windows-compat-v1-${{ runner.arch }}-

      - name: Verify Restored Windows Cache Contents
        id: restored
        shell: powershell
        run: |
          $arguments = @('-B', 'tools/windows_actions_cache.py', 'restored', $env:RUNNER_ARCH)
          if ($env:WINDOWS_COMPATIBILITY) { $arguments += '--compatibility' }
          python @arguments

      - name: Prepare Windows Build Environment
        id: setup
        shell: powershell
        env:
          BLURAYSUBTITLE_GITHUB_TOKEN: ${{ github.token }}
          PIP_CACHE_DIR: ${{ runner.temp }}/${{ inputs.compatibility && 'bluraysubtitle-compat/downloads/pip' || 'bluraysubtitle-pip' }}
        run: |
          $expected = switch ($env:PACKAGE_ARCHITECTURE) {
            'x64' { 'AMD64' }
            'arm64' { 'ARM64' }
            default { throw 'Unknown Windows package architecture.' }
          }
          $setupArguments = @{
            Mode = 'Build'
            Language = 'en'
            BuildCacheDirectory = Join-Path $env:RUNNER_TEMP 'bluraysubtitle-builds'
          }
          if ($env:WINDOWS_COMPATIBILITY) {
            $setupArguments.CompatibilityWorkDirectory = Join-Path $env:RUNNER_TEMP 'bluraysubtitle-compat'
          }
          .\setup_windows_environment.ps1 @setupArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $manifestPath = if ($env:WINDOWS_COMPATIBILITY) {
            Join-Path $setupArguments.CompatibilityWorkDirectory "environment-manifest.json"
          } else {
            Join-Path $env:ProgramData "BluraySubtitle\environment-manifest.json"
          }
          $system = (Get-Content -LiteralPath $manifestPath -Raw -Encoding UTF8 | ConvertFrom-Json).system
          if ($system.architecture -ne $expected) {
            throw "Expected Windows $expected, found $($system.architecture)."
          }
          $outputs = @(
            "python=$($system.python_executable)"
            "seven_zip=$($system.seven_zip_executable)"
          )
          [IO.File]::AppendAllLines($env:GITHUB_OUTPUT, [string[]]$outputs, [Text.UTF8Encoding]::new($false))

      - name: Build and Verify Windows Package
        if: ${{ !inputs.compatibility }}
        shell: powershell
        env:
          BUILD_PYTHON: ${{ steps.setup.outputs.python }}
          BUILD_SEVEN_ZIP: ${{ steps.setup.outputs.seven_zip }}
          PYTHONUTF8: '1'
        run: |
          $package = $env:PACKAGE_NAME
          $dist = Join-Path $PWD "dist"
          $archive = Join-Path $dist "$package.7z"
          if (Test-Path -LiteralPath $archive) {
            throw "Package archive already exists: $archive"
          }

          & $env:BUILD_PYTHON -m PyInstaller --clean --noconfirm "$package.spec"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $bundle = Join-Path $dist $package
          $executable = Join-Path $bundle "$package.exe"
          $vspipe = Join-Path $bundle "_internal\Lib\site-packages\vapoursynth\vspipe.exe"
          $commitRecord = Join-Path $bundle "_internal\build-commit.txt"
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf) -or
              -not (Test-Path -LiteralPath $vspipe -PathType Leaf) -or
              -not (Test-Path -LiteralPath $commitRecord -PathType Leaf)) {
            throw "The Windows bundle is missing the application executable, VSPipe, or commit record."
          }
          Push-Location -LiteralPath $dist
          try {
            & $env:BUILD_SEVEN_ZIP a -t7z -mx=9 -md=64m -mmt=4 $archive $package
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $env:BUILD_SEVEN_ZIP t $archive
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }
          & $env:BUILD_PYTHON tools/verify_windows_package.py $archive --seven-zip $env:BUILD_SEVEN_ZIP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fingerprint Windows Cache Contents
        id: snapshot
        if: github.ref == 'refs/heads/main'
        shell: powershell
        env:
          BUILD_PYTHON: ${{ steps.setup.outputs.python }}
        run: |
          $arguments = @('-B', 'tools/windows_actions_cache.py', 'snapshot', $env:RUNNER_ARCH)
          if ($env:WINDOWS_COMPATIBILITY) { $arguments += '--compatibility' }
          & $env:BUILD_PYTHON @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save Python Package Downloads
        if: steps.snapshot.outputs.pip != '' && steps.snapshot.outputs.pip != steps.downloads.outputs.cache-matched-key
        uses: actions/cache/save@v6
        with:
          path: *pip-path
          key: ${{ steps.snapshot.outputs.pip }}

      - name: Save Windows Tool Artifacts
        if: (steps.snapshot.outputs.shared || steps.snapshot.outputs.tools) != '' && (steps.snapshot.outputs.shared || steps.snapshot.outputs.tools) != steps.builds.outputs.cache-matched-key
        uses: actions/cache/save@v6
        with:
          path: *tools-path
          key: ${{ steps.snapshot.outputs.shared || steps.snapshot.outputs.tools }}

      - name: Save Standard x64 Tool Artifacts
        if: steps.snapshot.outputs.standard != '' && steps.snapshot.outputs.standard != steps.standard.outputs.cache-matched-key
        uses: actions/cache/save@v6
        with:
          path: *standard-path
          key: ${{ steps.snapshot.outputs.standard }}

      - name: Save Windows Compatibility Build Inputs
        if: inputs.compatibility && steps.snapshot.outputs.compat != '' && steps.snapshot.outputs.compat != steps.compat.outputs.cache-matched-key
        uses: actions/cache/save@v6
        with:
          path: *compat-path
          key: ${{ steps.snapshot.outputs.compat }}

      - name: Upload Compatibility Package
        if: inputs.compatibility
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ env.PACKAGE_NAME }}.7z
          if-no-files-found: error
          archive: false

      - name: Upload Package and Build Information
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          BUILD_SEVEN_ZIP: ${{ steps.setup.outputs.seven_zip }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
          SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          export PATH="/usr/bin:$PATH"
          archive="dist/$PACKAGE_NAME.7z"
          record=$(mktemp)
          trap 'rm -f -- "$record"' EXIT
          "$(cygpath -u "$BUILD_SEVEN_ZIP")" x -so "$archive" "$PACKAGE_NAME/_internal/build-commit.txt" > "$record"
          bash tools/publish_website_package.sh "$archive" "$record"

  prune-cache:
    needs: publish
    concurrency:
      group: windows-package-cache-prune-${{ inputs.architecture }}
      queue: max
    if: >-
      github.ref == 'refs/heads/main' &&
      (startsWith(needs.publish.outputs.restored-pip, 'windows-pip-v2-') ||
       startsWith(needs.publish.outputs.restored-tools, 'windows-tools-v4-') ||
       startsWith(needs.publish.outputs.restored-shared, 'windows-shared-v1-') ||
       startsWith(needs.publish.outputs.restored-standard, 'windows-standard-v1-') ||
       startsWith(needs.publish.outputs.restored-compat, 'windows-compat-v1-'))
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Remove Superseded Windows Caches
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_ARCHITECTURE: ${{ needs.publish.outputs.architecture }}
          RESTORED_PIP_CACHE: ${{ needs.publish.outputs.restored-pip }}
          RESTORED_TOOLS_CACHE: ${{ needs.publish.outputs.restored-tools }}
          RESTORED_SHARED_CACHE: ${{ needs.publish.outputs.restored-shared }}
          RESTORED_STANDARD_CACHE: ${{ needs.publish.outputs.restored-standard }}
          RESTORED_COMPAT_CACHE: ${{ needs.publish.outputs.restored-compat }}
        run: /usr/bin/python3 -B tools/windows_actions_cache.py prune "$CACHE_ARCHITECTURE"
