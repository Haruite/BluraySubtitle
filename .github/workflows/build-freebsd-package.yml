name: Build and Publish a FreeBSD Package

on:
  workflow_call:
    inputs:
      release:
        required: true
        type: string
      refresh-runtime:
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

concurrency:
  group: freebsd-x64-package-website
  queue: max

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    env:
      PACKAGE_ARCHIVE: BluraySubtitle_freebsd_x64.tar.xz
      FREEBSD_RELEASE: ${{ inputs.release }}
      PACKAGE_CACHE_PREFIX: freebsd-x64-v1-${{ inputs.release }}-
      FREEBSD_REFRESH_RUNTIME: ${{ inputs.refresh-runtime }}
      BLURAY_LANG: en
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Record Commit and Cache Period
        id: inputs
        run: |
          set -euo pipefail
          [[ "$FREEBSD_RELEASE" =~ ^(14|15)\.[0-9]+$ ]]
          mkdir -p build/freebsd-cache
          git show --no-patch --no-notes --no-show-signature --format='commit=%H%ncommit_time=%cI' HEAD > build/freebsd-commit.txt
          printf 'period=%s\n' "$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore FreeBSD Runtime and Build Cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: &cache-paths |
            build/freebsd-cache/runtime
            build/freebsd-cache/components
            build/freebsd-cache/downloads
            build/freebsd-cache/packages
            build/freebsd-cache/ccache
            build/freebsd-cache/pip
            build/freebsd-cache/cargo/registry/cache
            build/freebsd-cache/cargo/registry/index
            build/freebsd-cache/cargo/git/db
            build/freebsd-cache/go-mod/cache/download
            build/freebsd-cache/go-build
            build/freebsd-cache/zig-cache
          key: freebsd-x64-v1-${{ inputs.release }}-${{ steps.inputs.outputs.period }}-lookup
          restore-keys: |
            freebsd-x64-v1-${{ inputs.release }}-${{ steps.inputs.outputs.period }}-
            freebsd-x64-v1-${{ inputs.release }}-

      - name: Build and Verify FreeBSD Archive
        uses: vmactions/freebsd-vm@v1
        env:
          FREEBSD_CACHE_PERIOD: ${{ steps.inputs.outputs.period }}
        with:
          release: ${{ inputs.release }}
          arch: x86_64
          cpu: 4
          mem: 8192
          sync: rsync
          disable-cache: true
          envs: FREEBSD_RELEASE FREEBSD_REFRESH_RUNTIME FREEBSD_CACHE_PERIOD BLURAY_LANG GITHUB_SHA
          run: |
            set -eu
            export BLURAY_SETUP_CACHE_DIR="$PWD/build/freebsd-cache"
            # Let the VM action copy completed work back without merging a partial runtime.
            trap '
              status=$?
              if [ "$status" -ne 0 ]; then
                rm -rf -- "$BLURAY_SETUP_CACHE_DIR/runtime" "$BLURAY_SETUP_CACHE_DIR/runtime-next"
              fi
              printf "%s\n" "$status" > build/freebsd-build-status
              exit 0
            ' EXIT
            export BLURAY_FREEBSD_COMMIT_FILE="$PWD/build/freebsd-commit.txt"
            if [ "$FREEBSD_REFRESH_RUNTIME" != true ] &&
                [ "$(cat "$BLURAY_SETUP_CACHE_DIR/runtime/cache-period" 2>/dev/null || :)" = "$FREEBSD_CACHE_PERIOD" ]; then
              if [ -x "$BLURAY_SETUP_CACHE_DIR/runtime/bin/python3" ] &&
                  [ -s "$BLURAY_SETUP_CACHE_DIR/runtime/cache-generation" ] &&
                  sh setup_freebsd_environment.sh --mode Build --release "$FREEBSD_RELEASE" --restore-only; then
                exit 0
              fi
              # Keep the component caches so a broken runtime can be assembled again.
              rm -rf -- "$BLURAY_SETUP_CACHE_DIR/runtime"
              : > build/freebsd-runtime-invalid
            fi
            sh setup_freebsd_environment.sh --mode Build --release "$FREEBSD_RELEASE"
            printf '%s\n' "$FREEBSD_CACHE_PERIOD" > "$BLURAY_SETUP_CACHE_DIR/runtime/cache-period"
            # A repaired snapshot needs a new key even when its build inputs match.
            generation="$BLURAY_SETUP_CACHE_DIR/runtime/cache-generation"
            if [ ! -f "$generation" ]; then
              printf '%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$generation"
            fi
            rm -rf -- "$BLURAY_SETUP_CACHE_DIR/native"
            # rsync copyback leaves deleted guest files on the runner.
            mv -- "$BLURAY_SETUP_CACHE_DIR/runtime" "$BLURAY_SETUP_CACHE_DIR/runtime-next"

      - name: Prepare FreeBSD Cache
        id: snapshot
        env:
          RESTORED_CACHE_KEY: ${{ steps.cache.outputs.cache-matched-key }}
          FREEBSD_CACHE_PERIOD: ${{ steps.inputs.outputs.period }}
        run: |
          set -euo pipefail
          read -r build_status < build/freebsd-build-status
          [[ "$build_status" =~ ^[0-9]+$ ]]
          prefix="freebsd-x64-v1-$FREEBSD_RELEASE-$FREEBSD_CACHE_PERIOD"
          cd build/freebsd-cache
          if [[ "$build_status" != 0 ]]; then
            if [[ -f ../freebsd-runtime-invalid ]]; then
              rm -rf -- runtime
            fi
            key="$prefix-failed-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          elif [[ -d runtime-next ]]; then
            rm -rf -- runtime
            mv -- runtime-next runtime
            digest=$(cat runtime/{runtime.json,cache-generation} | sha256sum)
            key="$prefix-${digest%% *}"
          else
            key="$RESTORED_CACHE_KEY"
            [[ -n "$key" ]]
          fi
          printf 'key=%s\nexit-code=%s\n' "$key" "$build_status" >> "$GITHUB_OUTPUT"

      - name: Save FreeBSD Runtime and Build Cache
        if: github.ref == 'refs/heads/main' && steps.snapshot.outputs.key != steps.cache.outputs.cache-matched-key
        uses: actions/cache/save@v6
        with:
          path: *cache-paths
          key: ${{ steps.snapshot.outputs.key }}

      - name: Prune Superseded FreeBSD Caches
        if: github.ref == 'refs/heads/main' && steps.snapshot.outputs.key != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SAVED_CACHE: ${{ steps.snapshot.outputs.key }}
        run: |
          python3 -B tools/actions_cache.py "$PACKAGE_CACHE_PREFIX" "$SAVED_CACHE" \
            "freebsd-$FREEBSD_RELEASE-" "apt-pkgs-linux-x64-ubuntu26-"

      - name: Report FreeBSD Build Failure
        if: ${{ !cancelled() && steps.snapshot.outputs.exit-code != '' && steps.snapshot.outputs.exit-code != '0' }}
        env:
          BUILD_EXIT_CODE: ${{ steps.snapshot.outputs.exit-code }}
        run: |
          echo "::error::FreeBSD build failed with exit code $BUILD_EXIT_CODE."
          exit "$BUILD_EXIT_CODE"

      - name: Upload Workflow Archive
        uses: actions/upload-artifact@v7
        with:
          name: BluraySubtitle_freebsd_x64
          path: |
            dist/${{ env.PACKAGE_ARCHIVE }}
            dist/${{ env.PACKAGE_ARCHIVE }}.txt
          compression-level: 0
          if-no-files-found: error

      - name: Upload Package and Build Information
        if: github.ref == 'refs/heads/main'
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
          SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
        run: bash tools/publish_website_package.sh "dist/$PACKAGE_ARCHIVE"
