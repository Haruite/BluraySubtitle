name: Build and Publish an Ubuntu Package

on:
  workflow_call:
    inputs:
      architecture:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ inputs.architecture == 'arm64' && 'ubuntu-arm64-package-website' || 'ubuntu-package-website' }}
  queue: max

jobs:
  publish:
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 180
    outputs:
      architecture: ${{ runner.arch }}
      restored-setup: ${{ steps.downloads.outputs.cache-matched-key }}
      restored-tools: ${{ steps.cached.outputs.built == 'true' && steps.builds.outputs.cache-matched-key || '' }}
      restored-apt: ${{ steps.cached.outputs.built == 'true' && steps.apt-runtime.outputs.cache-matched-key || '' }}
    env:
      BLURAY_LANG: en
      CCACHE_MAXSIZE: 2G
      PACKAGE_ARCHIVE: BluraySubtitle_ubuntu26.04_${{ inputs.architecture }}.tar.xz
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set Build and Cache Paths
        run: |
          {
            printf 'BLURAY_SETUP_CACHE_DIR=%s/bluraysubtitle-linux\n' "$RUNNER_TEMP"
            printf 'BLURAY_BUILD_TMP=%s/bluraysubtitle-build\n' "$RUNNER_TEMP"
            printf 'BLURAY_APT_RESTORED_PACKAGES=%s/bluraysubtitle-restored-apt-packages.json\n' "$RUNNER_TEMP"
            printf 'BLURAY_APT_CACHE_PATHS=%s/bluraysubtitle-apt-paths.txt\n' "$RUNNER_TEMP"
          } >> "$GITHUB_ENV"

      - name: Restore Setup Downloads and Compiler Cache
        id: downloads
        uses: actions/cache/restore@v6
        with:
          path: &downloads-paths |
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/downloads
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/pip
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/ccache
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/cargo
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ubuntu2604-setup-v2-${{ runner.arch }}-lookup
          restore-keys: ubuntu2604-setup-v2-${{ runner.arch }}-

      - name: Restore Legacy Setup Cache
        id: legacy-downloads
        if: steps.downloads.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/downloads
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/apt
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/pip
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/ccache
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/cargo
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ubuntu2604-setup-v1-${{ runner.arch }}-lookup
          restore-keys: ubuntu2604-setup-v1-${{ runner.arch }}-

      - name: Restore Installed Build Artifacts
        id: builds
        uses: actions/cache/restore@v6
        with:
          path: &tools-paths ${{ env.BLURAY_SETUP_CACHE_DIR }}/builds/components/*.tar.xz
          key: ubuntu2604-tools-v3-${{ runner.arch }}-lookup
          restore-keys: |
            ubuntu2604-tools-v3-${{ runner.arch }}-
            ubuntu2604-tools-v2-${{ runner.arch }}-

      - name: Read the Previous x64 Build Recipes
        if: startsWith(steps.builds.outputs.cache-matched-key, 'ubuntu2604-tools-v2-X64-')
        run: |
          set -euo pipefail
          revision=0094649202280d37968cd33a2c152a3051c32481
          if git cat-file -e "$revision:setup_linux_environment.sh" 2>/dev/null ||
             git fetch --no-tags --depth=1 --no-write-fetch-head origin "$revision"; then
            legacy="$RUNNER_TEMP/ubuntu-legacy-setup.sh"
            git show "$revision:setup_linux_environment.sh" > "$legacy"
            printf 'BLURAY_LEGACY_CACHE_SETUP=%s\n' "$legacy" >> "$GITHUB_ENV"
          else
            echo "::warning::Could not read the previous x64 build recipes"
          fi

      - name: Restore Ubuntu APT Packages and Manifest
        id: apt-runtime
        uses: actions/cache/restore@v6
        with:
          path: &apt-paths |
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/apt/*.deb
            ${{ env.BLURAY_SETUP_CACHE_DIR }}/apt-runtime/packages.json
          key: ubuntu2604-apt-runtime-v3-${{ runner.arch }}-lookup
          restore-keys: ubuntu2604-apt-runtime-v3-${{ runner.arch }}-

      - name: Restore Legacy APT Manifest
        id: legacy-apt
        if: steps.apt-runtime.outputs.cache-matched-key == '' && steps.legacy-downloads.outputs.cache-matched-key != ''
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.BLURAY_SETUP_CACHE_DIR }}/apt-runtime
          key: ubuntu2604-apt-runtime-v2-${{ runner.arch }}-lookup
          restore-keys: ubuntu2604-apt-runtime-v2-${{ runner.arch }}-

      - name: Build Ubuntu Package from Cached Tools
        id: cached
        if: steps.builds.outputs.cache-matched-key != '' && (steps.apt-runtime.outputs.cache-matched-key != '' || steps.legacy-apt.outputs.cache-matched-key != '')
        env:
          BLURAYSUBTITLE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          output=$(mktemp -d "$RUNNER_TEMP/ubuntu-cached-package.XXXXXXXX")
          trap 'rm -rf -- "$output"' EXIT
          if bash setup_linux_environment.sh --mode Build --restore-only &&
              bash tools/build_ubuntu_package.sh "$output" &&
              /usr/bin/python3 -B tools/verify_ubuntu_package.py "$output/$PACKAGE_ARCHIVE"; then
            mkdir -p dist
            mv --update=none-fail -- "$output/$PACKAGE_ARCHIVE" "$output/$PACKAGE_ARCHIVE.txt" dist/
            printf 'built=true\n' >> "$GITHUB_OUTPUT"
          else
            echo 'Cached Ubuntu build could not be verified. Running setup.'
          fi

      - name: Prepare Ubuntu Build Environment
        if: steps.cached.outputs.built != 'true'
        env:
          BLURAYSUBTITLE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash setup_linux_environment.sh --mode Build

      - name: Build and Verify Ubuntu Package
        if: steps.cached.outputs.built != 'true'
        run: |
          set -euo pipefail
          bash tools/build_ubuntu_package.sh
          /usr/bin/python3 -B tools/verify_ubuntu_package.py "dist/$PACKAGE_ARCHIVE"

      - name: Fingerprint Verified Build Caches
        id: snapshot
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          set -euo pipefail
          if ! /usr/bin/python3 -B tools/ubuntu_apt_cache.py save "$BLURAY_SETUP_CACHE_DIR" "$BLURAY_APT_CACHE_PATHS"; then
            rm -f -- "$BLURAY_SETUP_CACHE_DIR/apt-runtime/packages.json"
            echo "::warning::Could not collect the APT package cache"
          fi
          /usr/bin/python3 -B tools/ubuntu_actions_cache.py snapshot "$RUNNER_ARCH"

      - name: Save Setup Downloads and Compiler Cache
        if: steps.snapshot.outputs.setup != '' && steps.snapshot.outputs.setup != steps.downloads.outputs.cache-matched-key
        uses: actions/cache/save@v6
        with:
          path: *downloads-paths
          key: ${{ steps.snapshot.outputs.setup }}

      - name: Save Installed Build Artifacts
        if: steps.snapshot.outputs.tools != '' && steps.snapshot.outputs.tools != steps.builds.outputs.cache-matched-key
        uses: actions/cache/save@v6
        with:
          path: *tools-paths
          key: ${{ steps.snapshot.outputs.tools }}

      - name: Save Ubuntu APT Packages and Manifest
        if: steps.snapshot.outputs.apt != '' && steps.apt-runtime.outputs.cache-matched-key != steps.snapshot.outputs.apt
        uses: actions/cache/save@v6
        with:
          path: *apt-paths
          key: ${{ steps.snapshot.outputs.apt }}

      - name: Upload Package and Build Information
        if: github.ref == 'refs/heads/main'
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
          SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
        run: bash tools/publish_website_package.sh "dist/$PACKAGE_ARCHIVE"

  prune-cache:
    needs: publish
    if: >-
      github.ref == 'refs/heads/main' &&
      (startsWith(needs.publish.outputs.restored-setup, 'ubuntu2604-setup-v2-') ||
       startsWith(needs.publish.outputs.restored-tools, 'ubuntu2604-tools-v3-') ||
       startsWith(needs.publish.outputs.restored-apt, 'ubuntu2604-apt-runtime-v3-'))
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Remove Superseded Ubuntu Caches
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_ARCHITECTURE: ${{ needs.publish.outputs.architecture }}
          RESTORED_SETUP_CACHE: ${{ needs.publish.outputs.restored-setup }}
          RESTORED_TOOLS_CACHE: ${{ needs.publish.outputs.restored-tools }}
          RESTORED_APT_CACHE: ${{ needs.publish.outputs.restored-apt }}
        run: /usr/bin/python3 -B tools/ubuntu_actions_cache.py prune "$CACHE_ARCHITECTURE"
