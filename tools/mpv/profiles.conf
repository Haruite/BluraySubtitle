# Linux playback presets adapted from mpv-lazy 2026FM.

[mpv-lazy-picture]
profile-restore=copy
video-sync=display-resample
interpolation=yes
cscale=bilinear
scale=bilinear
dscale=bicubic
sigmoid-upscaling=no
correct-downscaling=no
dither-depth=no
deinterlace=auto
glsl-shaders="~~/mpv-lazy/shaders/QCOM/QCOM_SGEDS_ms_RT.glsl"

[mpv-lazy-subtitles]
profile-restore=copy
sub-auto=fuzzy
sub-file-paths=sub:Subs:subtitles
sub-codepage=GB18030
slang=chs,sc,zh-cn,chi,zh,zh-tw,cht,zho,ze
subs-fallback=yes
sub-font-size=44
sub-scale-signs=yes
sub-outline-size=4
sub-blur=1
sub-color="#FFD766"
sub-use-margins=yes
sub-ass-force-margins=yes
